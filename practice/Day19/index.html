<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🛒 Addis Market</h1>
            <p>My Ethiopian Shopping List</p>
        </header>


        <!-- ADD ITEM FORM -->

        <section class="form-section">

            <h2>Add an Item</h2>

            <form id="add-form">

                <div class="input-group">

                    <label for="name">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Teff"
                    >

                </div>


                <div class="input-group">

                    <label for="price">
                        Price (ETB)
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 500"
                        min="0.01"
                        step="0.01"
                    >

                </div>


                <button type="submit">
                    Add to Shopping List
                </button>

            </form>

        </section>


        <!-- SHOPPING LIST -->

        <section class="shopping-section">

            <h2>Shopping List</h2>

            <ul id="list"></ul>

        </section>


        <!-- TOTAL -->

        <section class="total-section">

            <span>Total</span>

            <strong id="total">
                0.00 ETB
            </strong>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
