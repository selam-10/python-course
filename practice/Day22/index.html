<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Birr Watch</h1>
            <p>Convert Ethiopian Birr to other currencies using live exchange rates.</p>
        </header>

        <!-- Status -->
        <p id="status" class="status">Loading rates...</p>

        <!-- Converter -->
        <section class="card">
            <h2>Currency Converter</h2>

            <form id="convert-form">

                <label for="amount">Amount in ETB</label>
                <input
                    type="number"
                    id="amount"
                    min="0"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >

                <label for="currency">Convert to</label>
                <select id="currency" required>
                    <option value="">Select currency</option>
                </select>

                <button type="submit">Convert</button>

            </form>

            <p id="result" class="result"></p>
        </section>

        <!-- Watchlist -->
        <section class="card">
            <h2>My Watchlist</h2>

            <ul id="watchlist">
                <li class="empty">Your watchlist is empty.</li>
            </ul>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
