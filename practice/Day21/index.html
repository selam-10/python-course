<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #error {
            min-height: 24px;
            margin-top: 15px;
            color: #c62828;
            font-weight: bold;
        }

        #count {
            margin-top: 20px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Signup Form</h1>

        <p class="description">
            Sign up using your name and Ethiopian phone number.
        </p>

        <form id="signup-form">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="0912345678"
            >

            <button type="submit">Sign Up</button>

            <p id="error"></p>

        </form>

        <p id="count">0 people have signed up.</p>

    </main>

    <script src="app.js"></script>

</body>
</html>
